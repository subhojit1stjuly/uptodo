name: uptodo
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Database for the app
  drift: ^2.26.0
  drift_flutter: ^0.2.4
  objectbox: ^5.0.2
  objectbox_flutter_libs: ^5.0.2

  flutter_dotenv: ^5.1.0
  # state management
  flutter_bloc: ^9.1.1
  # routing
  go_router: ^14.1.4
  # dependency injection and functional Programming.
  get_it: ^7.7.0
  injectable: ^2.4.4
  # for code generation
  freezed_annotation: ^3.1.0
  json_annotation: ^4.0.0
  # for localizations
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

  flutter_svg: ^2.0.10+1
  path_provider: ^2.1.0
  path: ^1.8.0
  flutter_hooks: ^0.20.5
  rxdart: ^0.28.0
  fpdart: ^1.1.1
  equatable: ^2.0.7
  # custom widgets
  calendar_date_picker2: ^1.1.5
  smooth_page_indicator: ^1.2.0+3
  feedback: ^3.1.0
  talker: ^4.6.10

  # for animations
  flutter_animate: ^4.5.2

  #firebase
  firebase_core: ^3.11.0
  firebase_auth: ^5.5.0
  google_sign_in: ^6.2.2
dev_dependencies:
  flutter_lints: ^6.0.0
  # for testing
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  patrol_finders: ^2.9.0
  patrol: ^3.20.0
  mocktail: ^1.0.4
  bloc_test: ^10.0.0
  # for code generation
  full_coverage: ^1.0.0
  go_router_builder:
  objectbox_generator: ^5.0.2
  build_runner:
  freezed: ^3.2.3
  flutter_gen_runner: ^5.12.0
  injectable_generator: ^2.9.1
  # for translation
  intl_utils: ^2.8.12
  json_serializable: ^6.11.2
  drift_dev: ^2.28.3

objectbox:
  output_dir: core/storage/objectbox/config/

flutter:
  uses-material-design: true
  generate: true # Enables generation of localized strings from arb files
  assets:
    - assets/icons/
    - environments/.env
  fonts:
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
        - asset: assets/fonts/Lato-Italic.ttf
          style: italic
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700

patrol:
  app_name: UpTodo
  android:
    package_name: com.example.uptodo
  ios:
    bundle_id: com.example.uptodo